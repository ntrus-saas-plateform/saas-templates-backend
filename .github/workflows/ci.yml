name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm test:architecture

      - run: pnpm test:security

      - name: Integration tests
        run: pnpm test:integration
        env:
          TESTCONTAINERS: 'true'

      - name: E2E tests
        run: pnpm test:e2e
        env:
          TESTCONTAINERS: 'true'

      - name: Load tests
        run: pnpm test:load
        env:
          TESTCONTAINERS: 'true'

      - run: pnpm audit --audit-level=high

      - run: pnpm build

  edge-route-alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Edge routes diff (informational)
        run: python scripts/extract-edge-routes.py --diff

      # Fail-closed: regenerate with `pnpm edge:routes:extract` then commit artifacts.
      - name: Edge routes extract drift check (fail-closed)
        run: python scripts/extract-edge-routes.py --check
